[project]
name = "health-speech-analysis"
version = "0.1.0"
description = "Web demo for speech transcription and exploratory audio measures"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "boto3>=1.42.76",
    "fastapi>=0.135.1",
    "ffmpeg-python>=0.2.0",
    "imageio-ffmpeg>=0.6.0",
    "jiwer>=4.0.0",
    "lexical-diversity>=0.1.1",
    "nltk>=3.9.3",
    "openai-whisper>=20250625",
    "pandas>=3.0.1",
    "pydub>=0.25.1",
    "python-multipart>=0.0.22",
    "setuptools>=82.0.0",
    "soundfile>=0.13.1",
    "spacy>=3.8.11",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchcodec>=0.10.0",
    "tscribe>=1.3.1",
    "uvicorn>=0.41.0",
]
